name: ci
on:
  push: {branches: [main]}
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with: {repository: yogvidwankhede/rubricon, ref: v0.5.0, path: rubricon}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with: {python-version: "3.14"}
      - run: pip install --require-hashes -r requirements.lock && pip install --no-deps -e ./rubricon -e .
      - run: python -m pyflakes src tests scripts
      - run: pytest -q
  reproduce:
    # Re-derive the HateXplain results, the retrospective and the iid gate simulation
    # from the raw public data and fail if any committed number changes.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with: {repository: yogvidwankhede/rubricon, ref: v0.5.0, path: rubricon}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with: {python-version: "3.14"}
      - run: pip install --require-hashes -r requirements.lock && pip install --no-deps -e ./rubricon -e .
      - run: ./scripts/fetch_data.sh && curl -fsSL -o data/hatexplain_post_id_divisions.json https://raw.githubusercontent.com/hate-alert/HateXplain/master/Data/post_id_divisions.json
      - run: make study && python -m rubricon_field.cross_corpus hatexplain && python -m rubricon_field.retro
      - run: python -m rubricon_field.gate_sim iid 1000
      - run: git diff --exit-code -- results/
