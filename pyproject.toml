[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rubricon-field"
version = "2.0.1"
description = "A field study: applying the Rubricon evaluation harness to real human annotations (HateXplain, Mathew et al. 2021)."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
# The statistical core lives in rubricon and is pure standard library.
# This package adds no numerical dependencies of its own, by design: every
# statistic reported here is computed by code that has an independent test
# suite in the parent repository.
dependencies = ["rubricon>=0.5.0", "numpy>=2", "pandas>=2", "pyarrow>=15", "scipy>=1.10", "matplotlib>=3.8"]

[project.optional-dependencies]
dev = ["pytest>=7", "statsmodels>=0.14", "pyflakes>=3"]
judges = ["anthropic>=1,<2"]

[project.scripts]
rubricon-field = "rubricon_field.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
